    <title>N Compiler</title>

  <link rel="stylesheet" crossorigin href="/assets/index-CxokXxSi.css">
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Suppress LSP-related errors from monaco-languageclient (runs BEFORE React) -->
    <script>
        window.addEventListener('unhandledrejection', function (event) {
            var msg = (event.reason && event.reason.message) || String(event.reason || '');
            if (
                msg.indexOf('Client is not running') !== -1 ||
                msg.indexOf('Pending response rejected') !== -1 ||
                msg.indexOf('connection got disposed') !== -1 ||
                msg.indexOf('Server initialization failed') !== -1 ||
                msg.indexOf("couldn't create connection") !== -1
            ) {
                event.stopImmediatePropagation();
                event.preventDefault();
            }
        });
        window.addEventListener('error', function (event) {
            var msg = (event.message || '');
            if (
                msg.indexOf('Client is not running') !== -1 ||
                msg.indexOf('Pending response rejected') !== -1 ||
                msg.indexOf('connection got disposed') !== -1
            ) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return true;
            }
        });
    </script>
    <div id="root"></div>
</body>

</html>
